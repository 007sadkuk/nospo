name: 경기 데이터 자동 업데이트

on:
  schedule:
    - cron: '17 * * * *'     # 1시간마다
  workflow_dispatch:          # 수동 실행
  push:                       # 수집 설정이 바뀌면 바로 실행
    branches: [main]
    paths: ['scripts/**', 'sources.json', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "nospo-bot"
          git config user.email "nospo-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "경기 데이터 자동 업데이트"
          git pull --rebase origin main
          git push
