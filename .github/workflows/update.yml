name: 경기 데이터 자동 업데이트

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: 변경 사항 커밋
        run: |
          git config user.name "nospo-bot"
          git config user.email "nospo-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "경기 데이터 자동 업데이트" && git push)
