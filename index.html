<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>노스포 — 스포일러 없는 스포츠</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&family=Inter:wght@500;700;800;900&display=swap">

<style>
/* ━━━━━━━━━━━━━━━━━━━━ 토큰 ━━━━━━━━━━━━━━━━━━━━ */
:root {
  --bg:       #07070E;
  --bg2:      #0C0C1A;
  --surf:     #111126;
  --card:     #14142A;
  --card2:    #18183A;
  --border:   rgba(255,255,255,.07);
  --border2:  rgba(255,255,255,.12);
  --accent:   #7C6FFF;
  --accent2:  #3ECFAD;
  --accent3:  #FF4E6B;
  --gold:     #F5A623;
  --fg:       #EEEEF8;
  --fg2:      #9494B8;
  --fg3:      #4A4A70;
  --radius:   14px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  min-height: 100dvh;
  padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}

/* ━━━━━━━━━━━━━━━━━━━━ 헤더 ━━━━━━━━━━━━━━━━━━━━ */
.header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(7,7,14,.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 11px 16px 11px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #7C6FFF 0%, #3ECFAD 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.logo-text { line-height: 1.1; }
.logo-name {
  font-family: 'Inter', sans-serif;
  font-size: 17px; font-weight: 900;
  letter-spacing: -.5px;
  background: linear-gradient(90deg, #fff 0%, #9B92FF 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-sub { font-size: 10px; color: var(--fg3); }
.header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.admin-pill {
  background: var(--accent);
  color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
  display: none;
}
.admin-pill.on { display: block; }

/* ━━━━━━━━━━━━━━━━━━━━ 탭바 ━━━━━━━━━━━━━━━━━━━━ */
.tabs {
  display: flex;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: 59px;
  z-index: 39;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 13px 20px;
  font-size: 13px; font-weight: 700;
  color: var(--fg3);
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab:hover:not(.active) { color: var(--fg2); }

/* ━━━━━━━━━━━━━━━━━━━━ 메인 ━━━━━━━━━━━━━━━━━━━━ */
.page { max-width: 760px; margin: 0 auto; padding: 14px 14px 0; }

/* 관리자 추가 패널 */
.admin-panel {
  background: var(--surf);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
  display: none;
}
.admin-panel.on { display: block; }
.ap-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 12px; }
.ap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.ap-grid.full { grid-template-columns: 1fr; }
.f {
  width: 100%; padding: 9px 11px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 9px;
  color: var(--fg);
  font-size: 13px;
  font-family: 'Noto Sans KR', sans-serif;
  outline: none;
}
.f:focus { border-color: var(--accent); }
.f option { background: var(--surf); }
.ap-btns { display: flex; gap: 8px; margin-top: 4px; }
.ap-cancel { flex: 1; padding: 10px; background: var(--border); border: none; border-radius: 9px; color: var(--fg2); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.ap-add    { flex: 2; padding: 10px; background: var(--accent); border: none; border-radius: 9px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

/* 로딩 */
.loading { text-align: center; padding: 60px 0; color: var(--fg3); }
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 빈 상태 */
.empty { text-align: center; padding: 60px 20px; color: var(--fg3); font-size: 14px; }
.empty-icon { font-size: 36px; margin-bottom: 10px; }

/* ━━━━━━━━━━━━━━━━━━━━ 경기 카드 ━━━━━━━━━━━━━━━━━━━━ */
.match-list { display: flex; flex-direction: column; gap: 8px; }

.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .15s;
}
.match-card:hover { border-color: var(--border2); }

/* 카드 헤더 */
.mc-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.status-pill {
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
  white-space: nowrap; flex-shrink: 0;
}
.p-live { background: var(--accent3); color: #fff; }
.p-end  { background: rgba(255,255,255,.07); color: var(--fg3); }
.p-soon { background: rgba(62,207,173,.12); color: var(--accent2); }
.mc-info { flex: 1; min-width: 0; }
.mc-league { font-size: 10px; color: var(--fg3); margin-bottom: 2px; }
.mc-teams  { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-date   { font-size: 11px; color: var(--fg3); flex-shrink: 0; }
.mc-chevron { color: var(--fg3); font-size: 11px; transition: transform .2s; flex-shrink: 0; }
.match-card.open .mc-chevron { transform: rotate(180deg); }

/* 카드 바디 */
.mc-body {
  display: none;
  padding: 2px 14px 14px;
  border-top: 1px solid var(--border);
}
.match-card.open .mc-body { display: block; }

/* 스코어 */
.score-wrap { margin: 10px 0 10px; }
.score-btn {
  width: 100%; padding: 10px;
  background: rgba(124,111,255,.07);
  border: 1px dashed rgba(124,111,255,.28);
  border-radius: 10px;
  color: var(--fg2);
  font-size: 12px; font-weight: 700; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all .15s;
}
.score-btn:hover { background: rgba(124,111,255,.13); border-color: var(--accent); }
.score-reveal {
  display: none;
  background: var(--surf); border: 1px solid var(--border2);
  border-radius: 10px; padding: 12px 16px;
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 24px; font-weight: 900;
  letter-spacing: 3px;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.score-reveal.on { display: block; }

/* 액션 버튼 */
.mc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.act {
  flex: 1; min-width: 110px;
  padding: 10px 8px;
  border-radius: 10px; border: 1px solid;
  font-size: 12px; font-weight: 700; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
}
.act-hl   { background: rgba(124,111,255,.09); color: var(--accent); border-color: rgba(124,111,255,.22); }
.act-full { background: rgba(255,78,107,.07);  color: #FF7084; border-color: rgba(255,78,107,.22); }
.act-live { background: rgba(62,207,173,.07);  color: var(--accent2); border-color: rgba(62,207,173,.22); }
.act-del  { background: transparent; color: var(--fg3); border-color: var(--border); font-size: 11px; }
.act:hover { filter: brightness(1.15); }
.act:active { transform: scale(.97); }
.no-link  { font-size: 11px; color: var(--fg3); align-self: center; }

/* 삭제 행 */
.del-row { margin-top: 10px; }

/* ━━━━━━━━━━━━━━━━━━━━ 영상 모달 ━━━━━━━━━━━━━━━━━━━━ */
.player-modal {
  display: none;
  position: fixed; inset: 0;
  z-index: 90;
  background: rgba(0,0,0,.92);
  align-items: center; justify-content: center;
  flex-direction: column;
  padding: 16px;
}
.player-modal.on { display: flex; }
.player-wrap {
  position: relative;
  width: 100%;
  max-width: 820px;
  aspect-ratio: 16/9;
  border-radius: 14px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 20px 80px rgba(0,0,0,.8);
}
.player-wrap iframe {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  border: none;
}
.player-close {
  margin-top: 16px;
  background: rgba(255,255,255,.1); border: none;
  color: #fff; font-size: 14px; font-weight: 700;
  padding: 10px 28px; border-radius: 30px;
  cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.player-close:hover { background: rgba(255,255,255,.18); }
.player-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 100%);
  padding: 24px 16px 10px;
  font-size: 11px; color: rgba(255,255,255,.5);
  pointer-events: none;
}

/* ━━━━━━━━━━━━━━━━━━━━ 비밀번호 모달 ━━━━━━━━━━━━━━━━━━━━ */
.pw-modal {
  display: none;
  position: fixed; inset: 0;
  z-index: 80;
  background: rgba(0,0,0,.7);
  align-items: center; justify-content: center;
  padding: 20px;
}
.pw-modal.on { display: flex; }
.pw-box {
  background: var(--surf); border: 1px solid var(--border2);
  border-radius: 18px; padding: 24px;
  width: 100%; max-width: 320px;
}
.pw-box h3 { font-size: 15px; margin-bottom: 14px; }
.pw-err { font-size: 11px; color: var(--accent3); margin-bottom: 8px; display: none; }
.pw-btns { display: flex; gap: 8px; margin-top: 10px; }
.pw-cancel { flex: 1; padding: 10px; background: var(--border); border: none; border-radius: 9px; color: var(--fg2); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.pw-ok     { flex: 1; padding: 10px; background: var(--accent); border: none; border-radius: 9px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }

/* ━━━━━━━━━━━━━━━━━━━━ 설정 모달 ━━━━━━━━━━━━━━━━━━━━ */
.cfg-modal {
  display: none;
  position: fixed; inset: 0;
  z-index: 80;
  background: rgba(0,0,0,.8);
  align-items: flex-end; justify-content: center;
  padding: 0;
}
.cfg-modal.on { display: flex; }
.cfg-box {
  background: var(--surf);
  border-radius: 20px 20px 0 0;
  border: 1px solid var(--border2);
  width: 100%;
  max-width: 540px;
  padding: 20px 20px 32px;
}
.cfg-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 16px; }
.cfg-box h3 { font-size: 15px; margin-bottom: 6px; }
.cfg-box p  { font-size: 12px; color: var(--fg2); margin-bottom: 14px; line-height: 1.6; }
.cfg-label  { font-size: 11px; color: var(--fg3); margin-bottom: 4px; margin-top: 10px; }
.cfg-btns   { display: flex; gap: 8px; margin-top: 16px; }
.cfg-cancel { flex: 1; padding: 11px; background: var(--border); border: none; border-radius: 10px; color: var(--fg2); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.cfg-save   { flex: 2; padding: 11px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.cfg-status { font-size: 12px; margin-top: 10px; padding: 8px 12px; border-radius: 8px; display: none; }
.cfg-status.ok  { background: rgba(62,207,173,.12); color: var(--accent2); display: block; }
.cfg-status.err { background: rgba(255,78,107,.12); color: var(--accent3); display: block; }

/* ━━━━━━━━━━━━━━━━━━━━ 설정 버튼 ━━━━━━━━━━━━━━━━━━━━ */
.cfg-btn {
  background: transparent; border: 1px solid var(--border2);
  color: var(--fg2); font-size: 11px; font-weight: 600;
  padding: 5px 11px; border-radius: 20px;
  cursor: pointer; font-family: inherit;
}

</style>
</head>
<body>

<!-- ━━ 헤더 ━━ -->
<header class="header">
  <div class="logo" id="logo">
    <div class="logo-icon">🙈</div>
    <div class="logo-text">
      <div class="logo-name">노스포</div>
      <div class="logo-sub">No Spoiler Sports</div>
    </div>
  </div>
  <div class="header-right">
    <span class="admin-pill" id="adminPill">관리자</span>
    <button class="cfg-btn" id="cfgBtn">⚙ DB 설정</button>
  </div>
</header>

<!-- ━━ 탭 ━━ -->
<nav class="tabs" id="tabs">
  <div class="tab active" data-sport="soccer">⚽ 해외축구</div>
  <div class="tab" data-sport="baseball">⚾ KBO</div>
  <div class="tab" data-sport="lck">🎮 LCK</div>
  <div class="tab" data-sport="ufc">🥊 UFC</div>
</nav>

<!-- ━━ 페이지 ━━ -->
<div class="page">

  <!-- 관리자 추가 폼 -->
  <div class="admin-panel" id="adminPanel">
    <div class="ap-title">⚙ 경기 추가</div>
    <div class="ap-grid">
      <select class="f" id="aeSport">
        <option value="soccer">⚽ 해외축구</option>
        <option value="baseball">⚾ KBO</option>
        <option value="lck">🎮 LCK</option>
        <option value="ufc">🥊 UFC</option>
      </select>
      <input class="f" id="aeLeague" placeholder="대회명 (예: EPL)">
    </div>
    <div class="ap-grid full">
      <input class="f" id="aeTeams" placeholder="팀A vs 팀B">
    </div>
    <div class="ap-grid">
      <input class="f" type="date" id="aeDate">
      <select class="f" id="aeStatus">
        <option value="end">경기 종료</option>
        <option value="soon">경기 예정</option>
        <option value="live">진행 중</option>
      </select>
    </div>
    <div class="ap-grid full">
      <input class="f" id="aeScore" placeholder="스코어 (예: 2-1 / 판정승)">
    </div>
    <div class="ap-grid full">
      <input class="f" id="aeHighlight" placeholder="하이라이트 유튜브 URL">
    </div>
    <div class="ap-grid full">
      <input class="f" id="aeFull" placeholder="풀영상 유튜브 URL">
    </div>
    <div class="ap-grid full">
      <input class="f" id="aeLive" placeholder="중계 URL (다음스포츠, 유튜브 등)">
    </div>
    <div class="ap-btns">
      <button class="ap-cancel" id="apClose">닫기</button>
      <button class="ap-add" id="apAdd">+ 추가</button>
    </div>
  </div>

  <!-- 경기 목록 -->
  <div id="matchArea">
    <div class="loading">
      <div class="spinner"></div>
      <div>불러오는 중…</div>
    </div>
  </div>

</div><!-- /page -->

<!-- ━━ 영상 모달 ━━ -->
<div class="player-modal" id="playerModal">
  <div class="player-wrap">
    <iframe id="playerFrame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    <div class="player-label">youtube-nocookie.com · 타이틀/추천 없음</div>
  </div>
  <button class="player-close" id="playerClose">✕ 닫기</button>
</div>

<!-- ━━ 비밀번호 모달 ━━ -->
<div class="pw-modal" id="pwModal">
  <div class="pw-box">
    <h3>🔑 관리자 모드</h3>
    <div class="pw-err" id="pwErr">비밀번호가 틀렸습니다</div>
    <input class="f" type="password" id="pwInput" placeholder="비밀번호">
    <div class="pw-btns">
      <button class="pw-cancel" id="pwCancel">취소</button>
      <button class="pw-ok" id="pwOk">확인</button>
    </div>
  </div>
</div>

<!-- ━━ DB 설정 모달 ━━ -->
<div class="cfg-modal" id="cfgModal">
  <div class="cfg-box">
    <div class="cfg-handle"></div>
    <h3>⚙ Supabase 연결 설정</h3>
    <p>Supabase 프로젝트 URL과 anon key를 입력하면 모든 기기에서 경기 데이터를 공유할 수 있어요.<br>설정은 이 기기에만 저장됩니다.</p>
    <div class="cfg-label">Supabase Project URL</div>
    <input class="f" id="cfgUrl" placeholder="https://xxxx.supabase.co" style="margin-bottom:0">
    <div class="cfg-label">Supabase Anon Key</div>
    <input class="f" id="cfgKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." style="margin-bottom:0">
    <div class="cfg-status" id="cfgStatus"></div>
    <div class="cfg-btns">
      <button class="cfg-cancel" id="cfgCancel">취소</button>
      <button class="cfg-save" id="cfgSave">저장 &amp; 연결</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 설정
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const ADMIN_PW   = 'nospo2025';
const LS_URL_KEY = 'nospo_sb_url';
const LS_KEY_KEY = 'nospo_sb_key';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 상태
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let supabase = null;
let isAdmin  = false;
let currentSport = 'soccer';
let matches  = [];
let logoClicks = 0, logoTimer = null;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 유틸
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const $ = id => document.getElementById(id);

function ytId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function ytEmbed(url) {
  const id = ytId(url);
  if (!id) return null;
  return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&color=white`;
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${dt.getMonth()+1}/${dt.getDate()}(${days[dt.getDay()]})`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Supabase SDK (body 하단에 로드됨)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function loadSupabaseSDK() {
  return Promise.resolve(typeof window.supabase !== 'undefined');
}

function initSupabase() {
  return false;
}

async function loadMatches() {
  if (!supabase) {
    matches = getSeedMatches();
    renderMatches();
    return;
  }
  renderLoading();
  const { data, error } = await supabase
    .from('matches')
    .select('*')
    .order('created_at', { ascending: false });
  if (error) {
    matches = getSeedMatches();
    renderMatches();
    return;
  }
  matches = data || [];
  renderMatches();

  // 실시간 구독
  supabase
    .channel('matches-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => loadMatches())
    .subscribe();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 렌더
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderLoading() {
  $('matchArea').innerHTML = `<div class="loading"><div class="spinner"></div><div>불러오는 중…</div></div>`;
}

function renderMatches() {
  const list = matches
    .filter(m => m.sport === currentSport)
    .sort((a, b) => {
      const o = { live: 0, end: 1, soon: 2 };
      if ((o[a.status] ?? 1) !== (o[b.status] ?? 1))
        return (o[a.status] ?? 1) - (o[b.status] ?? 1);
      return new Date(b.date || 0) - new Date(a.date || 0);
    });

  if (!list.length) {
    $('matchArea').innerHTML = `<div class="empty"><div class="empty-icon">📋</div>등록된 경기가 없어요</div>`;
    return;
  }

  const html = list.map(m => cardHtml(m)).join('');
  $('matchArea').innerHTML = `<div class="match-list">${html}</div>`;

  // 이벤트 위임
  $('matchArea').querySelectorAll('.mc-head').forEach(h => {
    h.addEventListener('click', () => h.closest('.match-card').classList.toggle('open'));
  });
  $('matchArea').querySelectorAll('.score-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      $(`sc-${id}`).classList.add('on');
      btn.style.display = 'none';
    });
  });
  $('matchArea').querySelectorAll('.act-hl-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openPlayer(btn.dataset.url); });
  });
  $('matchArea').querySelectorAll('.act-full-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); openPlayer(btn.dataset.url); });
  });
  $('matchArea').querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      await deleteMatch(btn.dataset.id);
    });
  });
}

function cardHtml(m) {
  const id = m.id || m.match_id;
  const pillCls = m.status === 'live' ? 'p-live' : m.status === 'end' ? 'p-end' : 'p-soon';
  const pillTxt = m.status === 'live' ? '🔴 LIVE' : m.status === 'end' ? '종료' : '예정';

  let scoreHtml = '';
  if (m.status === 'end' && m.score) {
    scoreHtml = `
      <div class="score-wrap">
        <button class="score-btn" data-id="${id}">🔒 스코어 보기 (스포일러 주의)</button>
        <div class="score-reveal" id="sc-${id}">${escHtml(m.score)}</div>
      </div>`;
  } else if (m.status === 'live') {
    scoreHtml = `<div style="font-size:12px;color:var(--accent3);padding:10px 0 6px">🔴 현재 진행 중</div>`;
  } else {
    scoreHtml = `<div style="font-size:12px;color:var(--accent2);padding:10px 0 6px">📅 ${fmtDate(m.date)} 예정</div>`;
  }

  let actions = '';
  if (m.highlight && ytId(m.highlight)) {
    actions += `<button class="act act-hl act-hl-btn" data-url="${escHtml(m.highlight)}">🎬 하이라이트</button>`;
  }
  if (m.full && ytId(m.full)) {
    actions += `<button class="act act-full act-full-btn" data-url="${escHtml(m.full)}">📺 풀영상</button>`;
  }
  if (m.live) {
    actions += `<a class="act act-live" href="${escHtml(m.live)}" target="_blank" rel="noopener">📡 중계</a>`;
  }
  if (!actions) {
    actions = `<span class="no-link">링크 없음</span>`;
  }

  const delHtml = isAdmin
    ? `<div class="del-row"><button class="act act-del del-btn" data-id="${id}" style="width:100%;min-width:0">🗑 삭제</button></div>`
    : '';

  return `
    <div class="match-card" data-id="${id}">
      <div class="mc-head">
        <span class="status-pill ${pillCls}">${pillTxt}</span>
        <div class="mc-info">
          <div class="mc-league">${escHtml(m.league || '')}</div>
          <div class="mc-teams">${escHtml(m.teams || '')}</div>
        </div>
        <span class="mc-date">${fmtDate(m.date)}</span>
        <span class="mc-chevron">▼</span>
      </div>
      <div class="mc-body">
        ${scoreHtml}
        <div class="mc-actions">${actions}</div>
        ${delHtml}
      </div>
    </div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 영상 플레이어
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openPlayer(url) {
  const embed = ytEmbed(url);
  if (!embed) { window.open(url, '_blank'); return; }
  $('playerFrame').src = embed;
  $('playerModal').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  $('playerFrame').src = '';
  $('playerModal').classList.remove('on');
  document.body.style.overflow = '';
}

$('playerClose').addEventListener('click', closePlayer);
$('playerModal').addEventListener('click', e => { if (e.target === $('playerModal')) closePlayer(); });

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 경기 추가 / 삭제
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('apAdd').addEventListener('click', async () => {
  const sport     = $('aeSport').value;
  const league    = $('aeLeague').value.trim();
  const teams     = $('aeTeams').value.trim();
  const date      = $('aeDate').value;
  const status    = $('aeStatus').value;
  const score     = $('aeScore').value.trim();
  const highlight = $('aeHighlight').value.trim();
  const full      = $('aeFull').value.trim();
  const live      = $('aeLive').value.trim();

  if (!teams || !date) { alert('팀명과 날짜를 입력하세요.'); return; }

  const row = { sport, league, teams, date, status, score, highlight, full, live };

  if (supabase) {
    const { error } = await supabase.from('matches').insert([row]);
    if (error) { alert('저장 실패: ' + error.message); return; }
  } else {
    matches.unshift({ ...row, id: 'local_' + Date.now() });
    renderMatches();
  }

  ['aeTeams','aeScore','aeHighlight','aeFull','aeLive','aeLeague'].forEach(k => { $(k).value = ''; });
  currentSport = sport;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sport === sport));
  if (!supabase) renderMatches();
});

async function deleteMatch(id) {
  if (!confirm('삭제할까요?')) return;
  if (supabase && !id.startsWith('local_')) {
    await supabase.from('matches').delete().eq('id', id);
  } else {
    matches = matches.filter(m => (m.id || m.match_id) !== id);
    renderMatches();
  }
}

$('apClose').addEventListener('click', () => {
  $('adminPanel').classList.remove('on');
  isAdmin = false;
  $('adminPill').classList.remove('on');
  renderMatches();
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 탭
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentSport = tab.dataset.sport;
    renderMatches();
  });
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 로고 3번 → 관리자
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('logo').addEventListener('click', () => {
  logoClicks++;
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
  if (logoClicks >= 3) {
    logoClicks = 0;
    if (isAdmin) {
      isAdmin = false;
      $('adminPill').classList.remove('on');
      $('adminPanel').classList.remove('on');
      renderMatches();
    } else {
      $('pwInput').value = '';
      $('pwErr').style.display = 'none';
      $('pwModal').classList.add('on');
      setTimeout(() => $('pwInput').focus(), 50);
    }
  }
});

function checkPw() {
  if ($('pwInput').value === ADMIN_PW) {
    $('pwModal').classList.remove('on');
    isAdmin = true;
    $('adminPill').classList.add('on');
    $('adminPanel').classList.add('on');
    renderMatches();
  } else {
    $('pwErr').style.display = 'block';
    $('pwInput').value = '';
  }
}
$('pwOk').addEventListener('click', checkPw);
$('pwCancel').addEventListener('click', () => $('pwModal').classList.remove('on'));
$('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DB 설정 모달
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
$('cfgBtn').addEventListener('click', () => {
  $('cfgUrl').value = localStorage.getItem(LS_URL_KEY) || '';
  $('cfgKey').value = localStorage.getItem(LS_KEY_KEY) || '';
  $('cfgStatus').className = 'cfg-status';
  $('cfgModal').classList.add('on');
});
$('cfgCancel').addEventListener('click', () => $('cfgModal').classList.remove('on'));
$('cfgModal').addEventListener('click', e => { if (e.target === $('cfgModal')) $('cfgModal').classList.remove('on'); });

$('cfgSave').addEventListener('click', async () => {
  const url = $('cfgUrl').value.trim();
  const key = $('cfgKey').value.trim();
  if (!url || !key) { alert('URL과 Key를 모두 입력하세요.'); return; }

  $('cfgSave').textContent = '연결 중…';
  try {
    const loaded = await loadSupabaseSDK();
    if (!loaded) throw new Error('Supabase SDK 로드 실패');
    const sb = window.supabase.createClient(url, key);
    const { error } = await sb.from('matches').select('id').limit(1);
    if (error) throw error;
    localStorage.setItem(LS_URL_KEY, url);
    localStorage.setItem(LS_KEY_KEY, key);
    supabase = sb;
    $('cfgStatus').textContent = '✅ 연결 성공! 경기 데이터를 불러옵니다.';
    $('cfgStatus').className = 'cfg-status ok';
    setTimeout(() => {
      $('cfgModal').classList.remove('on');
      loadMatches();
    }, 1200);
  } catch(e) {
    $('cfgStatus').textContent = '❌ 연결 실패: ' + (e.message || '설정을 확인하세요.');
    $('cfgStatus').className = 'cfg-status err';
  }
  $('cfgSave').textContent = '저장 & 연결';
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 시드 (Supabase 없을 때)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  return [

    { id:'s2', sport:'soccer', league:'EPL', teams:'아스날 vs 맨시티', date:'2025-11-02', status:'end', score:'1-0', highlight:'', full:'', live:'' },

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 초기화
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
initSupabase();
loadMatches();
</script>
