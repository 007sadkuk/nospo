<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노스포</title>
<meta name="description" content="결과는 숨기고 하이라이트만. 해외축구·KBO·LCK·UFC 스포일러 없는 하이라이트.">
<meta name="theme-color" content="#0B0D12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 경기장 야간 조명 아래 전광판 — 한 가지 세계로 고정한 다크 디자인 */
:root {
  --ground: #0B0D12; --surface: #151922; --raised: #1E2330; --line: #262C3A;
  --text: #F3F5F8; --muted: #8D96A8; --faint: #566075;
  --accent: #FFB21A; --accent-ink: #14110A;
  --soccer: #33C17D; --baseball: #FF6A3D; --lck: #6C8CFF; --ufc: #FF3D57;
  --font: 'Gothic A1', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --display: 'Black Han Sans', 'Gothic A1', sans-serif;
  --cond: 'Barlow Condensed', 'Gothic A1', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; background: var(--ground); }
body { background: var(--ground); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; }

/* 헤더 */
.top { position: sticky; top: 0; z-index: 20; background: var(--ground); padding-top: env(safe-area-inset-top, 0px); }
.top.scrolled { border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; padding-block: 16px 14px; }
.wordmark { font-family: var(--display); font-size: 28px; line-height: 1; display: flex; align-items: center; gap: 2px; }
.wordmark .seal { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 4px 6px 1px; }
.updated { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.updated::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--soccer); }
.updated:empty { display: none; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tab { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; border-radius: 12px; background: var(--surface); border: 1.5px solid transparent; font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.tab .n { font-family: var(--cond); font-weight: 600; font-size: 13px; color: var(--faint); }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--ground)); }
.tab[aria-selected="true"] .n { color: var(--text); }
.leagues { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 14px 12px; }
.leagues::-webkit-scrollbar { display: none; }
.leagues[hidden] { display: none; }
.chip { flex-shrink: 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--ground); border-color: var(--text); }

/* 본문 */
main { display: flex; flex-direction: column; gap: 24px; padding-block: 10px 48px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
.feature { border-radius: 18px; padding: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, color-mix(in srgb, var(--c) 22%, var(--surface)) 0%, var(--surface) 70%); display: flex; flex-direction: column; gap: 18px; }
.meta { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
.side .name { font-weight: 800; font-size: 18px; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.mono { display: grid; place-items: center; flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--raised); border: 1.5px solid var(--c); font-weight: 800; font-size: 12px; }
.mono.big { width: 56px; height: 56px; border-width: 2px; font-size: 22px; }
.sealed { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.scorebox { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--ground) 60%, transparent); font-family: var(--cond); font-weight: 700; font-size: 30px; line-height: 1; color: var(--faint); }
.scorebox i { font-style: normal; font-size: 24px; }
.sealed small { font-size: 11px; color: var(--muted); font-weight: 500; }
.actions { display: flex; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 14px; border-radius: 12px; font-weight: 800; font-size: 15px; background: var(--raised); color: var(--text); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
.btn svg { width: 15px; height: 15px; }

.day-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.day-head b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.day-head span { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .06em; color: var(--faint); }
.list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; background: var(--surface); }
.row.watched { opacity: .55; }
.row .teams { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.row .team { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; min-width: 0; }
.row .team span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lock { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: 6px; background: var(--raised); font-family: var(--cond); font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.lock svg { width: 12px; height: 12px; }
.play { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; }
.play svg { width: 16px; height: 16px; margin-left: 2px; }
.row .more { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { padding: 4px 9px; border-radius: 7px; background: var(--raised); font-size: 12px; font-weight: 700; color: var(--text); }
.seen { font-family: var(--cond); font-weight: 600; font-size: 11px; color: var(--accent); letter-spacing: .06em; }

.state { text-align: center; padding: 64px 16px; color: var(--muted); }
.state b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
.state button { margin-top: 16px; padding: 10px 16px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.skel { height: 92px; background: var(--surface); }
.skel::after { content: ''; display: block; margin: 20px 16px; height: 12px; width: 50%; border-radius: 6px; background: var(--raised); box-shadow: 0 22px 0 0 var(--raised); }
@media (prefers-reduced-motion: no-preference) { .skel::after { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .45; } } }
.foot { text-align: center; color: var(--faint); font-size: 12px; }

/* 플레이어 */
.player { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.player.on { display: flex; }
.p-bar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.p-title { flex: 1; min-width: 0; }
.p-title .l { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.p-title .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-btn { padding: 9px 13px; border-radius: 10px; background: var(--raised); color: var(--text); font-size: 14px; font-weight: 700; white-space: nowrap; }
.p-btn[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.p-btn[hidden] { display: none; }
.stage { flex: 1; display: grid; place-items: center; min-height: 0; }
.frame { position: relative; width: 100%; max-width: min(100vw, calc((100dvh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
.frame:fullscreen { max-width: none; width: 100vw; height: 100vh; aspect-ratio: auto; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cover-top { position: absolute; left: 0; right: 0; top: 0; height: clamp(44px, 13%, 64px); background: #000; pointer-events: none; z-index: 2; }
.shield { position: absolute; inset: 0; z-index: 3; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
.shield.on { display: flex; }
.shield .big { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.shield .big svg { width: 24px; height: 24px; margin-left: 4px; }
.shield p { color: var(--muted); font-size: 14px; }
.p-foot { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px)); min-height: 64px; }
.p-note { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="wordmark" aria-label="노스포">노<span class="seal">스포</span></span>
      <span class="updated" id="updated"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-sport="soccer" style="--c:var(--soccer)"><span class="dot"></span>해외축구<span class="n"></span></button>
      <button class="tab" role="tab" data-sport="baseball" style="--c:var(--baseball)"><span class="dot"></span>KBO<span class="n"></span></button>
      <button class="tab" role="tab" data-sport="lck" style="--c:var(--lck)"><span class="dot"></span>LCK<span class="n"></span></button>
      <button class="tab" role="tab" data-sport="ufc" style="--c:var(--ufc)"><span class="dot"></span>UFC<span class="n"></span></button>
    </nav>
    <div class="leagues" id="leagues" hidden></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="p-bar">
    <div class="p-title"><div class="l" id="pLeague"></div><div class="t" id="pTitle"></div></div>
    <button class="p-btn" id="pFull" hidden>전체화면</button>
    <button class="p-btn" id="pClose">닫기</button>
  </div>
  <div class="stage">
    <div class="frame" id="frame">
      <div id="yt"></div>
      <div class="cover-top"></div>
      <div class="shield" id="shield"></div>
    </div>
  </div>
  <div class="p-foot" id="pFoot"></div>
</div>

<script>
const SPORTS = {
  soccer: { name: '해외축구', empty: '최근 올라온 해외축구 하이라이트가 없어요.' },
  baseball: { name: 'KBO', empty: 'KBO는 지금 비시즌이에요. 3월에 개막하면 자동으로 채워져요.' },
  lck: { name: 'LCK', empty: '최근 올라온 LCK 하이라이트가 없어요.' },
  ufc: { name: 'UFC', empty: '최근 올라온 UFC 경기 영상이 없어요.' },
};
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = [];
let sport = store.get('nospo.sport', 'soccer');
if (!SPORTS[sport]) sport = 'soccer';
let league = '전체';
const watched = new Set(store.get('nospo.watched', []));

// ── 데이터 ──
function normalize(m) {
  if (!m.videos) {   // 예전 형식(highlight 필드)도 읽기
    const id = u => (String(u || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];
    m.videos = [];
    if (id(m.highlight)) m.videos.push({ id: id(m.highlight), kind: 'main', label: '하이라이트' });
    if (id(m.fullvideo || m.full)) m.videos.push({ id: id(m.fullvideo || m.full), kind: 'full', label: '풀 하이라이트' });
  }
  return m;
}
async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    data = (d.matches || []).map(normalize).filter(m => m.videos.length && m.teams);
    if (d.updated) {
      const t = new Date(d.updated);
      $('updated').textContent = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} 업데이트`;
    }
    render();
  } catch (e) {
    $('main').innerHTML = `<div class="state"><b>경기 목록을 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 시도해 주세요.<br><button id="retry">다시 시도</button></div>`;
    $('retry').onclick = load;
  }
}

// ── 목록 화면 ──
const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const EN = { '프리미어리그': 'Premier League', '라리가': 'LaLiga', '분데스리가': 'Bundesliga', '세리에A': 'Serie A', '챔피언스리그': 'Champions League', '유로파리그': 'Europa League', '컨퍼런스리그': 'Conference League', '네이션스리그': 'Nations League', '스코틀랜드 리그': 'Scottish Premiership', 'K리그1': 'K League 1', 'K리그2': 'K League 2', 'MLS': 'MLS', 'KBO': 'KBO League', 'KBO 포스트시즌': 'KBO Postseason', 'KBO 한국시리즈': 'Korean Series', 'LCK': 'LCK', '월드 챔피언십': 'Worlds', 'UFC': 'UFC' };
const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
function dayLabel(d) {
  const utc = s => { const [y, m, dd] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); };
  const dt = utc(d);
  const today = utc(new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }));
  const diff = Math.round((today - dt) / 864e5);
  const code = `${String(dt.getUTCMonth() + 1).padStart(2, '0')}.${String(dt.getUTCDate()).padStart(2, '0')} ${DAYS[dt.getUTCDay()]}`;
  const name = diff === 0 ? '오늘' : diff === 1 ? '어제' : `${dt.getUTCMonth() + 1}월 ${dt.getUTCDate()}일`;
  return { name, code };
}
const initial = s => (s || '').trim().slice(0, 1).toUpperCase();
const mainOf = m => m.videos.find(v => v.kind === 'main') || m.videos.find(v => v.kind === 'full') || m.videos[0];
const playAttr = m => { const v = mainOf(m); return v.kind === 'game' ? `data-play="${esc(m.id)}" data-game="1"` : `data-play="${esc(m.id)}" data-v="${v.id}"`; };
function render() {
  document.querySelectorAll('.tab').forEach(t => {
    t.setAttribute('aria-selected', t.dataset.sport === sport);
    t.querySelector('.n').textContent = data.filter(m => m.sport === t.dataset.sport).length || '';
  });
  const inSport = data.filter(m => m.sport === sport);
  const leagues = ['전체', ...new Set(inSport.map(m => m.league).filter(Boolean))];
  if (!leagues.includes(league)) league = '전체';
  $('leagues').hidden = leagues.length <= 2;
  $('leagues').innerHTML = leagues.map(l => `<button class="chip" aria-pressed="${l === league}" data-league="${esc(l)}">${esc(l)}</button>`).join('');

  const list = inSport.filter(m => league === '전체' || m.league === league).sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) {
    $('main').innerHTML = `<div class="state"><b>아직 경기가 없어요</b>${SPORTS[sport].empty}</div>`;
    return;
  }
  // 아직 안 본 가장 최근 경기를 크게
  const feat = list.find(m => !m.videos.some(v => watched.has(v.id))) || list[0];
  const rest = list.filter(m => m !== feat);
  const days = new Map();
  rest.forEach(m => days.set(m.date, [...(days.get(m.date) || []), m]));
  $('main').innerHTML = featureHtml(feat) + [...days].map(([d, ms]) => {
    const lab = dayLabel(d);
    return `<section><h2 class="day-head"><b>${lab.name}</b><span>${lab.code}</span></h2><div class="list">${ms.map(rowHtml).join('')}</div></section>`;
  }).join('') + `<p class="foot">공식 유튜브 채널 영상만 모아요 · 3시간마다 자동 업데이트</p>`;
}
function featureHtml(m) {
  const [a, b = ''] = m.teams.split(' vs ');
  const full = m.videos.find(v => v.kind === 'full' && v !== mainOf(m));
  const games = mainOf(m).kind !== 'game' && m.videos.some(v => v.kind === 'game' && v.n === 1);
  const lab = dayLabel(m.date);
  return `<section style="--c:var(--${m.sport})">
    <p class="eyebrow">방금 올라온 경기</p>
    <article class="feature">
      <div class="meta">${esc(EN[m.league] || m.league)} · ${lab.code}</div>
      <div class="versus">
        <div class="side"><span class="mono big">${esc(initial(a))}</span><span class="name">${esc(a)}</span></div>
        <div class="sealed"><div class="scorebox">?<i>:</i>?</div><small>결과 숨김</small></div>
        <div class="side"><span class="mono big">${esc(initial(b))}</span><span class="name">${esc(b)}</span></div>
      </div>
      <div class="actions">
        <button class="btn primary" ${playAttr(m)}>${PLAY_ICON}하이라이트 보기</button>
        ${full ? `<button class="btn" data-play="${esc(m.id)}" data-v="${full.id}">풀 하이라이트</button>` : ''}
        ${games ? `<button class="btn" data-play="${esc(m.id)}" data-game="1">게임별로</button>` : ''}
      </div>
    </article></section>`;
}
function rowHtml(m) {
  const [a, b = ''] = m.teams.split(' vs ');
  const full = m.videos.find(v => v.kind === 'full' && v !== mainOf(m));
  const games = mainOf(m).kind !== 'game' && m.videos.some(v => v.kind === 'game' && v.n === 1);
  const seen = m.videos.some(v => watched.has(v.id));
  const more = (full ? `<button class="mini" data-play="${esc(m.id)}" data-v="${full.id}">풀 하이라이트</button>` : '')
    + (games ? `<button class="mini" data-play="${esc(m.id)}" data-game="1">게임별로</button>` : '');
  return `<article class="row${seen ? ' watched' : ''}" style="--c:var(--${m.sport})">
    <div class="teams">
      <div class="meta">${esc(EN[m.league] || m.league)}${seen ? ' · <span class="seen">WATCHED</span>' : ''}</div>
      <div class="team"><span class="mono">${esc(initial(a))}</span><span>${esc(a)}</span></div>
      <div class="team"><span class="mono">${esc(initial(b))}</span><span>${esc(b)}</span></div>
      ${more ? `<div class="more">${more}</div>` : ''}
    </div>
    <span class="lock">${LOCK_ICON}? : ?</span>
    <button class="play" ${playAttr(m)} aria-label="${esc(m.teams)} 재생">${PLAY_ICON}</button>
  </article>`;
}
addEventListener('scroll', () => document.querySelector('.top').classList.toggle('scrolled', scrollY > 4), { passive: true });

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { sport = tab.dataset.sport; league = '전체'; store.set('nospo.sport', sport); render(); window.scrollTo(0, 0); return; }
  const chip = e.target.closest('.chip');
  if (chip) { league = chip.dataset.league; render(); return; }
  const p = e.target.closest('[data-play]');
  if (p) {
    const m = data.find(x => x.id === p.dataset.play);
    if (!m) return;
    if (p.dataset.game) openGame(m, 1);
    else openVideo(m, m.videos.find(v => v.id === p.dataset.v));
  }
});

// ── 플레이어: 유튜브 제목·추천 영상이 보이지 않게 가림 ──
let yt = null, ytReady = false, current = null;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
const VARS = { autoplay: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, fs: 0 };

function shield(html) { $('shield').innerHTML = html; $('shield').classList.toggle('on', !!html); }
function mountVideo(id) {
  shield('');
  if (yt?.loadVideoById) { yt.loadVideoById(id); return; }
  const el = $('yt');
  if (el.tagName === 'IFRAME') { el.src = `https://www.youtube-nocookie.com/embed/${id}?${new URLSearchParams(VARS)}`; return; }
  if (ytReady && window.YT?.Player) {
    yt = new YT.Player('yt', { host: 'https://www.youtube-nocookie.com', videoId: id, playerVars: VARS, events: { onStateChange: onState } });
  } else {
    // API가 아직 안 왔으면 일반 임베드로 바로 재생
    const f = document.createElement('iframe');
    f.id = 'yt';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.src = `https://www.youtube-nocookie.com/embed/${id}?${new URLSearchParams(VARS)}`;
    el.replaceWith(f);
  }
}
function onState(e) {
  const S = YT.PlayerState;
  if (e.data === S.PAUSED) {
    shield(`<button class="big" id="resume" aria-label="계속 보기">${PLAY_ICON}</button><p>일시정지 · 추천 영상은 가려 뒀어요</p>`);
    $('resume').onclick = () => { shield(''); yt.playVideo(); };
  } else if (e.data === S.ENDED) {
    const next = nextGame();
    shield(next
      ? `<p>게임 ${current.n} 끝</p><button class="p-btn" id="goNext">게임 ${next.n} 보기</button>`
      : `<p>영상이 끝났어요</p><button class="p-btn" id="goClose">목록으로</button>`);
    if (next) $('goNext').onclick = () => openGame(current.match, next.n);
    else $('goClose').onclick = closePlayer;
  } else if (e.data === S.PLAYING) {
    shield('');
  }
}
function markWatched(id) { watched.add(id); store.set('nospo.watched', [...watched].slice(-500)); }
function show(m, title) {
  $('pLeague').textContent = m.league || SPORTS[m.sport].name;
  $('pTitle').textContent = title;
  $('player').classList.add('on');
  document.body.style.overflow = 'hidden';
  $('pFull').hidden = !$('frame').requestFullscreen;
}
function openVideo(m, v) {
  if (!v) return;
  current = { match: m, v, n: null };
  show(m, m.teams);
  const opts = m.videos.filter(x => x.kind !== 'game');
  $('pFoot').innerHTML = opts.length > 1
    ? opts.map(x => `<button class="p-btn" data-v="${x.id}" ${x === v ? 'aria-current="true"' : ''}>${esc(x.label)}</button>`).join('')
    : '';
  $('pFoot').querySelectorAll('[data-v]').forEach(b => b.onclick = () => openVideo(m, m.videos.find(x => x.id === b.dataset.v)));
  mountVideo(v.id); markWatched(v.id);
}
// 전체 게임 수가 보이면 스포일러라서, 지금 게임과 "다음 게임" 버튼만 보여 줌
function nextGame() {
  if (!current?.n) return null;
  return current.match.videos.find(x => x.kind === 'game' && x.n === current.n + 1) || null;
}
function openGame(m, n) {
  const v = m.videos.find(x => x.kind === 'game' && x.n === n);
  if (!v) return;
  current = { match: m, v, n };
  show(m, `${m.teams} · 게임 ${n}`);
  $('pFoot').innerHTML = `<button class="p-btn" id="nextBtn">다음 게임</button>`;
  $('nextBtn').onclick = () => {
    const next = nextGame();
    if (next) openGame(m, next.n);
    else $('pFoot').innerHTML = `<span class="p-note">이 경기는 게임 ${n}에서 끝났어요</span>`;
  };
  mountVideo(v.id); markWatched(v.id);
}
function closePlayer() {
  $('player').classList.remove('on');
  document.body.style.overflow = '';
  if (yt?.stopVideo) yt.stopVideo();
  else { const f = $('yt'); if (f?.tagName === 'IFRAME') f.src = 'about:blank'; }
  if (document.fullscreenElement) document.exitFullscreen();
  shield('');
  render();
}
$('pClose').onclick = closePlayer;
$('pFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('frame').requestFullscreen();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('player').classList.contains('on') && !document.fullscreenElement) closePlayer(); });

load();
setInterval(() => { if (!$('player').classList.contains('on')) load(); }, 10 * 60 * 1000);
</script>
</body>
</html>
