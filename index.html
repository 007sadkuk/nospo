<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노스포</title>
<meta name="description" content="결과는 숨기고 하이라이트만. 해외축구·KBO·LCK·UFC 스포일러 없는 하이라이트.">
<meta name="theme-color" content="#0D1118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 스포츠 중계 모음 사이트 느낌: 남색 바탕 + 중계 빨강 */
:root {
  --bg: #0D1118; --panel: #141A24; --card: #18202C; --card-hi: #1F2937; --line: #263040;
  --text: #F2F5FA; --muted: #8A96AA; --faint: #556178;
  --red: #FF3653; --red-ink: #FFFFFF;
  --soccer: #2FD07F; --baseball: #FF7A3D; --lck: #5B8CFF; --ufc: #FF3653;
  --font: 'Pretendard', 'Gothic A1', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --display: 'Black Han Sans', 'Gothic A1', sans-serif;
  --cond: 'Barlow Condensed', 'Gothic A1', sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }

/* 상단 바 */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.brand { display: flex; align-items: center; gap: 10px; padding-block: 12px; }
.wordmark { font-family: var(--display); font-size: 26px; line-height: 1; letter-spacing: -.5px; display: flex; align-items: center; }
.wordmark .seal { background: var(--red); color: #fff; border-radius: 5px; padding: 3px 6px 1px; margin-left: 2px; transform: skewX(-8deg); display: inline-block; }
.tag { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .12em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
.updated { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.updated::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--soccer); box-shadow: 0 0 0 3px color-mix(in srgb, var(--soccer) 25%, transparent); }
.updated:empty { display: none; }

/* 종목 메뉴 */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-bottom: 12px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 9px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-weight: 700; font-size: 13px; position: relative; }
.tab .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.tab .ico svg { width: 18px; height: 18px; }
.tab .n { position: absolute; top: 6px; right: 7px; font-family: var(--cond); font-weight: 700; font-size: 12px; color: var(--faint); }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 20%, var(--panel)), var(--panel)); }
.tab[aria-selected="true"] .ico { background: var(--c); color: #0D1118; }
.tab[aria-selected="true"] .n { color: var(--text); }
@media (min-width: 720px) { .tabs { grid-template-columns: repeat(4, 160px); } .tab { flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; } .tab .n { position: static; } }
.leagues { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 12px; }
.leagues::-webkit-scrollbar { display: none; }
.leagues[hidden] { display: none; }
.chip { flex-shrink: 0; padding: 6px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

/* 경기 카드 그리드 */
main { padding-block: 16px 48px; display: flex; flex-direction: column; gap: 26px; }
.day-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 800; font-size: 16px; }
.day-head .bar { width: 4px; height: 16px; border-radius: 2px; background: var(--red); }
.day-head span { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .06em; color: var(--faint); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } }
@media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; position: relative; transition: transform .15s ease, border-color .15s ease; }
@media (hover: hover) { .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 60%, var(--line)); } }
.card-top { display: flex; align-items: center; gap: 6px; padding: 9px 10px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 22%, var(--card)), var(--card)); border-bottom: 1px solid var(--line); }
.lg { font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.lockpill { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--bg) 55%, transparent); padding: 3px 6px; border-radius: 5px; }
.lockpill svg { width: 10px; height: 10px; }
@media (max-width: 719px) { .lockpill .t { display: none; } }
.card-body { padding: 12px 10px 10px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 800; font-size: 15px; }
.team span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crest { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #0D1118; background: var(--c); }
.crest.b { background: var(--card-hi); color: var(--text); border: 1.5px solid var(--c); }
.score { margin-left: auto; font-family: var(--cond); font-weight: 700; font-size: 16px; color: var(--faint); }
.card-foot { display: flex; gap: 6px; padding: 0 10px 10px; }
.watch { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 8px; border-radius: 9px; background: var(--red); color: var(--red-ink); font-weight: 800; font-size: 14px; white-space: nowrap; }
.watch svg { width: 12px; height: 12px; }
.sub { padding: 10px; border-radius: 9px; background: var(--card-hi); font-size: 13px; font-weight: 700; white-space: nowrap; }
.card.watched { opacity: .5; }
.card.watched .watch { background: var(--card-hi); color: var(--muted); }
.seen { position: absolute; top: 40px; right: 8px; font-size: 10px; font-weight: 800; color: var(--muted); }

.state { text-align: center; padding: 64px 16px; color: var(--muted); }
.state b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
.state button { margin-top: 16px; padding: 10px 16px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 800; }
.skel { height: 150px; border-radius: 14px; background: var(--card); }
@media (prefers-reduced-motion: no-preference) { .skel { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .5; } } }
.foot { text-align: center; color: var(--faint); font-size: 12px; }

/* 플레이어 */
.player { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
.player.on { display: flex; }
.p-bar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.p-title { flex: 1; min-width: 0; }
.p-title .l { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.p-title .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-btn { padding: 9px 13px; border-radius: 10px; background: var(--card-hi); color: var(--text); font-size: 14px; font-weight: 700; white-space: nowrap; }
.p-btn[aria-current="true"] { background: var(--red); color: #fff; }
.p-btn[hidden] { display: none; }
.stage { flex: 1; display: grid; place-items: center; min-height: 0; }
.frame { position: relative; width: 100%; max-width: min(100vw, calc((100dvh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
.frame:fullscreen { max-width: none; width: 100vw; height: 100vh; aspect-ratio: auto; }
.frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cover-top { position: absolute; left: 0; top: 0; width: calc(100% - 120px); height: clamp(44px, 13%, 64px); background: linear-gradient(90deg, #000 85%, transparent); pointer-events: none; z-index: 2; }
.shield { position: absolute; inset: 0; z-index: 3; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
.shield.on { display: flex; }
.shield .big { width: 64px; height: 64px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; }
.shield .big svg { width: 24px; height: 24px; margin-left: 4px; }
.shield p { color: var(--muted); font-size: 14px; }
.p-foot { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px)); min-height: 64px; }
.p-note { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="wordmark" aria-label="노스포">노<span class="seal">스포</span></span><span class="tag">NO SPOILER</span>
      <span class="updated" id="updated"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-sport="soccer" style="--c:var(--soccer)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z" fill="currentColor" stroke="none"/></svg></span>해외축구<span class="n"></span></button>
      <button class="tab" role="tab" data-sport="baseball" style="--c:var(--baseball)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M7 5c2 4 2 10 0 14M17 5c-2 4-2 10 0 14"/></svg></span>KBO<span class="n"></span></button>
      <button class="tab" role="tab" data-sport="lck" style="--c:var(--lck)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11.5" r="1" fill="currentColor"/><circle cx="18" cy="13.5" r="1" fill="currentColor"/></svg></span>LCK<span class="n"></span></button>
      <button class="tab" role="tab" data-sport="ufc" style="--c:var(--ufc)"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11V7a3 3 0 0 1 3-3h4a4 4 0 0 1 4 4v5a6 6 0 0 1-6 6h-1a4 4 0 0 1-4-4v-1"/><path d="M7 11h6"/></svg></span>UFC<span class="n"></span></button>
    </nav>
    <div class="leagues" id="leagues" hidden></div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="p-bar">
    <div class="p-title"><div class="l" id="pLeague"></div><div class="t" id="pTitle"></div></div>
    <button class="p-btn" id="pCC">자막 켜기</button>
    <button class="p-btn" id="pFull" hidden>전체화면</button>
    <button class="p-btn" id="pClose">닫기</button>
  </div>
  <div class="stage">
    <div class="frame" id="frame">
      <div id="yt"></div>
      <div class="cover-top"></div>
      <div class="shield" id="shield"></div>
    </div>
  </div>
  <div class="p-foot" id="pFoot"></div>
</div>

<script>
const SPORTS = {
  soccer: { name: '해외축구', empty: '최근 올라온 해외축구 하이라이트가 없어요.' },
  baseball: { name: 'KBO', empty: 'KBO는 지금 비시즌이에요. 3월에 개막하면 자동으로 채워져요.' },
  lck: { name: 'LCK', empty: '최근 올라온 LCK 하이라이트가 없어요.' },
  ufc: { name: 'UFC', empty: '최근 올라온 UFC 경기 영상이 없어요.' },
};
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = [];
let sport = store.get('nospo.sport', 'soccer');
if (!SPORTS[sport]) sport = 'soccer';
let league = '전체';
const watched = new Set(store.get('nospo.watched', []));

// ── 데이터 ──
function normalize(m) {
  if (!m.videos) {   // 예전 형식(highlight 필드)도 읽기
    const id = u => (String(u || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];
    m.videos = [];
    if (id(m.highlight)) m.videos.push({ id: id(m.highlight), kind: 'main', label: '하이라이트' });
    if (id(m.fullvideo || m.full)) m.videos.push({ id: id(m.fullvideo || m.full), kind: 'full', label: '풀 하이라이트' });
  }
  return m;
}
async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    data = (d.matches || []).map(normalize).filter(m => m.videos.length && m.teams);
    if (d.updated) {
      const t = new Date(d.updated);
      $('updated').textContent = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} 업데이트`;
    }
    render();
  } catch (e) {
    $('main').innerHTML = `<div class="state"><b>경기 목록을 불러오지 못했어요</b>인터넷 연결을 확인하고 다시 시도해 주세요.<br><button id="retry">다시 시도</button></div>`;
    $('retry').onclick = load;
  }
}

// ── 목록 화면 ──
const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const EN = { '프리미어리그': 'Premier League', '라리가': 'LaLiga', '분데스리가': 'Bundesliga', '세리에A': 'Serie A', '챔피언스리그': 'Champions League', '유로파리그': 'Europa League', '컨퍼런스리그': 'Conference League', '네이션스리그': 'Nations League', '스코틀랜드 리그': 'Scottish Premiership', 'K리그1': 'K League 1', 'K리그2': 'K League 2', 'MLS': 'MLS', 'KBO': 'KBO League', 'KBO 포스트시즌': 'KBO Postseason', 'KBO 한국시리즈': 'Korean Series', 'LCK': 'LCK', '월드 챔피언십': 'Worlds', 'UFC': 'UFC' };
const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
function dayLabel(d) {
  const utc = s => { const [y, m, dd] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); };
  const dt = utc(d);
  const today = utc(new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }));
  const diff = Math.round((today - dt) / 864e5);
  const code = `${String(dt.getUTCMonth() + 1).padStart(2, '0')}.${String(dt.getUTCDate()).padStart(2, '0')} ${DAYS[dt.getUTCDay()]}`;
  const name = diff === 0 ? '오늘' : diff === 1 ? '어제' : `${dt.getUTCMonth() + 1}월 ${dt.getUTCDate()}일`;
  return { name, code };
}
const initial = s => (s || '').trim().slice(0, 1).toUpperCase();
const mainOf = m => m.videos.find(v => v.kind === 'main') || m.videos.find(v => v.kind === 'full') || m.videos[0];
const playAttr = m => { const v = mainOf(m); return v.kind === 'game' ? `data-play="${esc(m.id)}" data-game="1"` : `data-play="${esc(m.id)}" data-v="${v.id}"`; };
function render() {
  document.querySelectorAll('.tab').forEach(t => {
    t.setAttribute('aria-selected', t.dataset.sport === sport);
    t.querySelector('.n').textContent = data.filter(m => m.sport === t.dataset.sport).length || '';
  });
  const inSport = data.filter(m => m.sport === sport);
  const leagues = ['전체', ...new Set(inSport.map(m => m.league).filter(Boolean))];
  if (!leagues.includes(league)) league = '전체';
  $('leagues').hidden = leagues.length <= 2;
  $('leagues').innerHTML = leagues.map(l => `<button class="chip" aria-pressed="${l === league}" data-league="${esc(l)}">${esc(l)}</button>`).join('');

  const list = inSport.filter(m => league === '전체' || m.league === league).sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) {
    $('main').innerHTML = `<div class="state"><b>아직 경기가 없어요</b>${SPORTS[sport].empty}</div>`;
    return;
  }
  const days = new Map();
  list.forEach(m => days.set(m.date, [...(days.get(m.date) || []), m]));
  $('main').innerHTML = [...days].map(([d, ms]) => {
    const lab = dayLabel(d);
    return `<section><h2 class="day-head"><i class="bar"></i>${lab.name}<span>${lab.code}</span></h2><div class="grid">${ms.map(cardHtml).join('')}</div></section>`;
  }).join('') + `<p class="foot">공식 유튜브 채널 영상만 모아요 · 1시간마다 자동 업데이트</p>`;
}
function cardHtml(m) {
  const [a, b = ''] = m.teams.split(' vs ');
  const full = m.videos.find(v => v.kind === 'full' && v !== mainOf(m));
  const games = mainOf(m).kind !== 'game' && m.videos.some(v => v.kind === 'game' && v.n === 1);
  const seen = m.videos.some(v => watched.has(v.id));
  const lab = dayLabel(m.date);
  const sub = full ? `<button class="sub" data-play="${esc(m.id)}" data-v="${full.id}">풀</button>`
    : games ? `<button class="sub" data-play="${esc(m.id)}" data-game="1">게임별</button>` : '';
  return `<article class="card${seen ? ' watched' : ''}" style="--c:var(--${m.sport})">
    <div class="card-top"><span class="lg">${esc(EN[m.league] || m.league)}</span><span class="lockpill" title="결과 숨김">${LOCK_ICON}<span class="t">결과 숨김</span></span></div>
    ${seen ? '<span class="seen">시청함</span>' : ''}
    <div class="card-body">
      <div class="team"><span class="crest">${esc(initial(a))}</span><span>${esc(a)}</span></div>
      <div class="team"><span class="crest b">${esc(initial(b))}</span><span>${esc(b)}</span></div>
    </div>
    <div class="card-foot"><button class="watch" ${playAttr(m)} aria-label="${esc(m.teams)} 하이라이트 재생">${PLAY_ICON}하이라이트</button>${sub}</div>
  </article>`;
}

document.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) { sport = tab.dataset.sport; league = '전체'; store.set('nospo.sport', sport); render(); window.scrollTo(0, 0); return; }
  const chip = e.target.closest('.chip');
  if (chip) { league = chip.dataset.league; render(); return; }
  const p = e.target.closest('[data-play]');
  if (p) {
    const m = data.find(x => x.id === p.dataset.play);
    if (!m) return;
    if (p.dataset.game) openGame(m, 1);
    else openVideo(m, m.videos.find(v => v.id === p.dataset.v));
  }
});

// ── 플레이어: 유튜브 제목·추천 영상이 보이지 않게 가림 ──
let yt = null, ytReady = false, current = null;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
const VARS = { autoplay: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, fs: 0, cc_load_policy: 0, hl: 'ko' };
let ccOn = false;
function setCC(on) {
  ccOn = on;
  $('pCC').textContent = on ? '자막 끄기' : '자막 켜기';
  if (!yt?.unloadModule) return;
  try { if (on) { yt.loadModule('captions'); yt.setOption('captions', 'track', { languageCode: 'ko' }); } else { yt.unloadModule('captions'); yt.unloadModule('cc'); } } catch {}
}

function shield(html) { $('shield').innerHTML = html; $('shield').classList.toggle('on', !!html); }
function mountVideo(id) {
  shield('');
  if (yt?.loadVideoById) { yt.loadVideoById(id); return; }
  const el = $('yt');
  if (el.tagName === 'IFRAME') { el.src = `https://www.youtube-nocookie.com/embed/${id}?${new URLSearchParams(VARS)}`; return; }
  if (ytReady && window.YT?.Player) {
    yt = new YT.Player('yt', { host: 'https://www.youtube-nocookie.com', videoId: id, playerVars: VARS, events: { onStateChange: onState, onReady: () => setCC(false), onApiChange: () => { if (!ccOn) setCC(false); } } });
  } else {
    // API가 아직 안 왔으면 일반 임베드로 바로 재생
    const f = document.createElement('iframe');
    f.id = 'yt';
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.src = `https://www.youtube-nocookie.com/embed/${id}?${new URLSearchParams(VARS)}`;
    el.replaceWith(f);
  }
}
function onState(e) {
  const S = YT.PlayerState;
  if (e.data === S.PAUSED) {
    shield(`<button class="big" id="resume" aria-label="계속 보기">${PLAY_ICON}</button><p>일시정지 · 추천 영상은 가려 뒀어요</p>`);
    $('resume').onclick = () => { shield(''); yt.playVideo(); };
  } else if (e.data === S.ENDED) {
    const next = nextGame();
    shield(next
      ? `<p>게임 ${current.n} 끝</p><button class="p-btn" id="goNext">게임 ${next.n} 보기</button>`
      : `<p>영상이 끝났어요</p><button class="p-btn" id="goClose">목록으로</button>`);
    if (next) $('goNext').onclick = () => openGame(current.match, next.n);
    else $('goClose').onclick = closePlayer;
  } else if (e.data === S.PLAYING) {
    shield('');
    if (!ccOn) setCC(false);
  }
}
function markWatched(id) { watched.add(id); store.set('nospo.watched', [...watched].slice(-500)); }
function show(m, title) {
  $('pLeague').textContent = m.league || SPORTS[m.sport].name;
  $('pTitle').textContent = title;
  $('player').classList.add('on');
  document.body.style.overflow = 'hidden';
  $('pFull').hidden = !$('frame').requestFullscreen;
}
function openVideo(m, v) {
  if (!v) return;
  current = { match: m, v, n: null };
  show(m, m.teams);
  const opts = m.videos.filter(x => x.kind !== 'game');
  $('pFoot').innerHTML = opts.length > 1
    ? opts.map(x => `<button class="p-btn" data-v="${x.id}" ${x === v ? 'aria-current="true"' : ''}>${esc(x.label)}</button>`).join('')
    : '';
  $('pFoot').querySelectorAll('[data-v]').forEach(b => b.onclick = () => openVideo(m, m.videos.find(x => x.id === b.dataset.v)));
  mountVideo(v.id); markWatched(v.id);
}
// 전체 게임 수가 보이면 스포일러라서, 지금 게임과 "다음 게임" 버튼만 보여 줌
function nextGame() {
  if (!current?.n) return null;
  return current.match.videos.find(x => x.kind === 'game' && x.n === current.n + 1) || null;
}
function openGame(m, n) {
  const v = m.videos.find(x => x.kind === 'game' && x.n === n);
  if (!v) return;
  current = { match: m, v, n };
  show(m, `${m.teams} · 게임 ${n}`);
  $('pFoot').innerHTML = `<button class="p-btn" id="nextBtn">다음 게임</button>`;
  $('nextBtn').onclick = () => {
    const next = nextGame();
    if (next) openGame(m, next.n);
    else $('pFoot').innerHTML = `<span class="p-note">이 경기는 게임 ${n}에서 끝났어요</span>`;
  };
  mountVideo(v.id); markWatched(v.id);
}
function closePlayer() {
  $('player').classList.remove('on');
  document.body.style.overflow = '';
  if (yt?.stopVideo) yt.stopVideo();
  else { const f = $('yt'); if (f?.tagName === 'IFRAME') f.src = 'about:blank'; }
  if (document.fullscreenElement) document.exitFullscreen();
  shield('');
  render();
}
$('pClose').onclick = closePlayer;
$('pCC').onclick = () => setCC(!ccOn);
$('pFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('frame').requestFullscreen();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('player').classList.contains('on') && !document.fullscreenElement) closePlayer(); });

load();
setInterval(() => { if (!$('player').classList.contains('on')) load(); }, 10 * 60 * 1000);
</script>
</body>
